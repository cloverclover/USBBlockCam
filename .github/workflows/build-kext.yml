name: Build USBBlockCam kext

on:
  push:
    paths:
      - 'USBBlockCam/**'
      - '.github/workflows/build-kext.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: USBBlockCam
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build kext (make)
        run: make

      - name: Ad-hoc codesign
        run: |
          codesign -s - --force USBBlockCam.kext

      - name: Validate and stage
        run: |
          set -e
          ls -laR USBBlockCam.kext
          plutil -lint USBBlockCam.kext/Contents/Info.plist
          file USBBlockCam.kext/Contents/MacOS/USBBlockCam
          BIN=USBBlockCam.kext/Contents/MacOS/USBBlockCam
          SDKROOT=$(xcrun --sdk macosx --show-sdk-path)
          echo "--- SDK kmod.h macro check ---"
          grep -n "KMOD_EXPLICIT_DECL\|KMOD_INFO_VERSION" "$SDKROOT/usr/include/mach/kmod.h" || echo "NO SDK kmod.h?"
          echo "--- Mach-O header ---"
          otool -hv "$BIN"
          echo "--- kmod_info (REQUIRED by OC prelink) ---"
          nm "$BIN" | grep -i kmod || echo "NO kmod SYMBOL"
          nm -u "$BIN" | grep -i kmod && { echo "FAIL: kmod_info is undefined"; exit 1; } || true
          echo "--- _start/_stop symbols ---"
          nm "$BIN" | grep -E " _start$| _stop$" || echo "NO _start/_stop"
          nm "$BIN" | grep -E "[A-Z] _kmod_info$" || { echo "FAIL: no DEFINED _kmod_info symbol - OC injection will fail"; exit 1; }
          echo "--- Undefined symbol count ---"
          nm -u "$BIN" | wc -l
          echo "--- vtable symbols ---"
          nm "$BIN" | grep "__ZTV" | head -20 || true
          echo "--- Load commands / segments ---"
          otool -l "$BIN" | grep -E "segname|cmd " || true
          echo "--- LINKEDIT size ---"
          otool -l "$BIN" | grep -A7 "__LINKEDIT" || echo "NO LINKEDIT SEGMENT"
          echo "--- DYSYMTAB / SYMTAB ---"
          otool -l "$BIN" | grep -E "LC_SYMTAB|LC_DYSYMTAB" || echo "NO SYMTAB/DYSYMTAB"
          echo "--- Code signature ---"
          codesign -dvv "$BIN" 2>&1 || true
          mkdir -p dist
          cp -R USBBlockCam.kext dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: USBBlockCam-kext
          path: USBBlockCam/dist
