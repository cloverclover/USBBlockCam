name: USBBlockCam
options:
  bundleIdPrefix: com.opencode
  deploymentTarget:
    macOS: "10.13"
targets:
  USBBlockCam:
    type: kext
    platform: macOS
    sources:
      - path: USBBlockCam
        excludes:
          - "Info.plist"
          - "project.yml"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opencode.usbblockcam
        PRODUCT_NAME: USBBlockCam
        WRAPPER_EXTENSION: kext
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: USBBlockCam/Info.plist
        ARCHS: x86_64
        EXCLUDED_ARCHS: arm64
        SDKROOT: macosx
        MACOSX_DEPLOYMENT_TARGET: "10.13"
        DEAD_CODE_STRIPPING: NO
        Clang_CXXLanguageStandard: "c++17"
        Clang_CXXLibrary: "libc++"
